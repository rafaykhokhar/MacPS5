[package]
name = "native-ps5"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Apple Silicon PS5 compatibility prototype"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"

[profile.release]
overflow-checks = true
lto = "thin"

[lints.rust]
unsafe_code = "deny"
